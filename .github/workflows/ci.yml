name: analytics-quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate public synthetic snapshot
        run: python -m unittest discover -s tests -p "test_public_snapshot.py" -v

      - name: Load local analytical warehouse
        run: python scripts/load_duckdb.py

      - name: Build and test dbt project
        working-directory: dbt_fintech
        run: dbt build --profiles-dir .

      - name: Generate dbt documentation
        working-directory: dbt_fintech
        run: dbt docs generate --profiles-dir .
