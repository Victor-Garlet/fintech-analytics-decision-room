<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="395" viewBox="0 0 1200 395" role="img" aria-labelledby="title desc">
<title id="title">Two reporting clocks</title>
<desc id="desc">An illustrative transfer completes in June and settles in July. Operations counts its completion in June, while Finance counts the settlement in July. The generated dataset contains cross-month transfers.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#91A4B3" stroke-width="1.7"/></marker></defs>
<rect width="1200" height="395" fill="#F7FAFC"/>
<rect x="0" y="0" width="7" height="395" fill="#087F76"/>
<text x="52" y="37" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#087F76" text-anchor="start">03 / METRIC CONTRACT</text>
<text x="52" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#14273B" text-anchor="start">One transfer, two valid reporting months</text>
<text x="52" y="100" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#516477" text-anchor="start">Illustrative timing example. The event timestamp determines the reporting period.</text>
<text x="121" y="158" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#2D628F" text-anchor="start">JUNE</text>
<text x="1005" y="158" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#2D628F" text-anchor="start">JULY</text>
<path d="M126 189 H1070" fill="none" stroke="#9FB0BD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="298" cy="189" r="11" fill="#087F76"/>
<circle cx="888" cy="189" r="11" fill="#2D628F"/>
<text x="298" y="151" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#14273B" text-anchor="middle">Completed 30 Jun</text>
<text x="888" y="151" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#14273B" text-anchor="middle">Settled 2 Jul</text>
<rect x="127" y="233" width="345" height="77" rx="15" fill="#FFFFFF" stroke="#C8D5DD" stroke-width="1.5"/>
<text x="148" y="265" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#14273B" text-anchor="start">Operations</text>
<text x="148" y="290" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#087F76" text-anchor="start">Completion cohort: June</text>
<rect x="720" y="233" width="345" height="77" rx="15" fill="#FFFFFF" stroke="#C8D5DD" stroke-width="1.5"/>
<text x="741" y="265" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#14273B" text-anchor="start">Finance</text>
<text x="741" y="290" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#2D628F" text-anchor="start">Settlement period: July</text>
<text x="52" y="364" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#516477" text-anchor="start">884 records in this synthetic snapshot cross a completion-month boundary.</text>
</svg>
