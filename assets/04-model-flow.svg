<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Analytical model flow</title>
<desc id="desc">Eleven source CSV tables load into DuckDB raw tables, pass through typed dbt staging and two intermediate views, then form ten decision-facing marts. Automated data tests check relationships and reconciliations.</desc>
