<text x="52" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#14273B" text-anchor="start">From source records to a number a reader can challenge</text>
<text x="52" y="100" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#516477" text-anchor="start">Each layer has a job. Tests guard the hand-offs and the decision metrics.</text>
