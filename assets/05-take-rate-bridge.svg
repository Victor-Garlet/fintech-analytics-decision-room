<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="495" viewBox="0 0 1200 495" role="img" aria-labelledby="title desc">
<title id="title">Synthetic take-rate decomposition</title>
<desc id="desc">Collected take rate moves from 50.23 to 48.05 basis points. Portfolio mix contributes plus 0.09, within-cell list yield minus 0.02, approved price investment minus 0.57 and fee leakage minus 1.67 basis points.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#91A4B3" stroke-width="1.7"/></marker></defs>
<rect width="1200" height="495" fill="#F7FAFC"/>
<rect x="0" y="0" width="7" height="495" fill="#087F76"/>
<text x="52" y="37" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#087F76" text-anchor="start">05 / DIAGNOSIS</text>
<text x="52" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#14273B" text-anchor="start">A 2.18 bp fall is made of different decisions</text>
<text x="52" y="100" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#516477" text-anchor="start">H2 2025 compared with H1 2026. Signed impacts in basis points; all findings are synthetic.</text>
<rect x="52" y="124" width="1096" height="69" rx="15" fill="#FFFFFF" stroke="#C8D5DD" stroke-width="1.5"/>
<text x="76" y="153" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#516477" text-anchor="start">START</text>
<text x="76" y="180" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#14273B" text-anchor="start">50.23 bps</text>
<text x="1123" y="153" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#516477" text-anchor="end">END</text>
<text x="1123" y="180" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#14273B" text-anchor="end">48.05 bps</text>
<path d="M315 159 H866" fill="none" stroke="#A8B8C3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="67" y="242" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#14273B" text-anchor="start">Portfolio mix</text>
<rect x="1030" y="223" width="37.74" height="26" rx="5" fill="#2D628F" stroke="#2D628F" stroke-width="0"/>
<text x="1115" y="242" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#2D628F" text-anchor="end">+0.09</text>
<text x="67" y="300" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#14273B" text-anchor="start">List-price yield</text>
<rect x="1020.31" y="281" width="9.69" height="26" rx="5" fill="#2D628F" stroke="#2D628F" stroke-width="0"/>
<text x="1115" y="300" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#2D628F" text-anchor="end">-0.02</text>
<text x="67" y="358" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#14273B" text-anchor="start">Approved price investment</text>
<rect x="791.8" y="339" width="238.2" height="26" rx="5" fill="#087F76" stroke="#087F76" stroke-width="0"/>
<text x="1115" y="358" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#087F76" text-anchor="end">-0.57</text>
<text x="67" y="416" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#14273B" text-anchor="start">Unexpected fee leakage</text>
<rect x="336.68" y="397" width="693.32" height="26" rx="5" fill="#C34745" stroke="#C34745" stroke-width="0"/>
<text x="1115" y="416" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#C34745" text-anchor="end">-1.67</text>
<path d="M1030 215 V430" fill="none" stroke="#738A9C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="52" y="472" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#516477" text-anchor="start">Approved lower prices stay. The configuration shortfall is the part to correct.</text>
