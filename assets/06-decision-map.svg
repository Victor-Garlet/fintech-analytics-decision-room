<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">Evidence-to-action decision map</title>
<desc id="desc">The synthetic case recommends correcting the C07 pricing fault, repairing the C13/P04 settlement control and testing the C01 routing hypothesis before a policy change.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#91A4B3" stroke-width="1.7"/></marker></defs>
<rect width="1200" height="450" fill="#F7FAFC"/>
<rect x="0" y="0" width="7" height="450" fill="#087F76"/>
<text x="52" y="37" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#087F76" text-anchor="start">06 / DECISION</text>
<text x="52" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#14273B" text-anchor="start">Two fixes. One question for an experiment.</text>
<text x="52" y="100" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#516477" text-anchor="start">The action depends on how directly the evidence supports it.</text>
