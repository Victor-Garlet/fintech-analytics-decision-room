<text x="635" y="264" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#2D628F" text-anchor="start">39.7% exceptions</text>
<text x="635" y="290" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#516477" text-anchor="start">Direct settlement-record evidence</text>
