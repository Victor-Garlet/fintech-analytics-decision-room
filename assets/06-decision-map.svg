<text x="78" y="182" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#14273B" text-anchor="start">C07 business pricing rule</text>
<text x="635" y="165" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#087F76" text-anchor="start">$3,960.94 synthetic leakage</text>
<text x="635" y="191" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#516477" text-anchor="start">Direct fee-record evidence</text>
