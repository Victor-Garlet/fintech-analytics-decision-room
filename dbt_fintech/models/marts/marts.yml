version: 2

models:
  - name: mart_transfer_unit_economics
    description: Public-facing transfer-level mart for drill-down and auditability.
    columns:
      - name: transfer_id
        data_tests: [not_null, unique]

  - name: mart_executive_kpis
    description: Monthly executive scorecard using the transfer completion cohort.
    columns:
      - name: completion_month
        data_tests: [not_null, unique]
      - name: completed_transfers
        data_tests: [not_null]
      - name: cross_border_volume_usd
        data_tests: [not_null]
      - name: collected_take_rate_bps
        data_tests: [not_null]
      - name: contribution_margin_proxy_usd
        data_tests: [not_null]

  - name: mart_corridor_performance
    description: Monthly commercial and operational performance by transfer corridor.
    columns:
      - name: completion_month
        data_tests: [not_null]
      - name: corridor_id
        data_tests: [not_null]
      - name: completed_transfers
        data_tests: [not_null]

  - name: mart_provider_performance
    description: Monthly speed, cost and support trade-offs by provider and routing tier.
    columns:
      - name: completion_month
        data_tests: [not_null]
      - name: provider_id
        data_tests: [not_null]
      - name: routing_tier
        data_tests: [not_null]

  - name: mart_reconciliation_exceptions
    description: Investigation queue containing only reconciliation exceptions.
    columns:
      - name: transfer_id
        data_tests: [not_null, unique]
      - name: settlement_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [late, amount_mismatch, missing]

  - name: mart_take_rate_bridge
    description: H2 2025 to H1 2026 take-rate movement decomposed into mix, list yield, approved investment and leakage.
    columns:
      - name: component_order
        data_tests: [not_null, unique]
      - name: component_code
        data_tests: [not_null, unique]
      - name: impact_bps
        data_tests: [not_null]

  - name: mart_reporting_period_reconciliation
    description: Monthly bridge from the Operations completion cohort to Finance settlement-period reporting.
    columns:
      - name: reporting_month
        data_tests: [not_null, unique]
      - name: bridge_residual_usd
        data_tests: [not_null]

  - name: mart_speed_cost_tradeoff
    description: Observed H1 2026 speed, cost, support and contribution trade-off for the selected corridor.
    columns:
      - name: analysis_period
        data_tests: [not_null]
      - name: corridor_id
        data_tests: [not_null]
      - name: route_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [priority_speed_route, other_routes]

  - name: mart_routing_scenario
    description: Non-causal planning scenario used to frame a controlled routing experiment.
    columns:
      - name: scenario_name
        data_tests: [not_null, unique]
      - name: reroute_share
        data_tests: [not_null]

  - name: mart_fee_leakage_hotspots
    description: Fee leakage investigation queue aggregated by corridor and customer segment.
    columns:
      - name: corridor_id
        data_tests: [not_null]
      - name: customer_segment
        data_tests: [not_null]
      - name: fee_leakage_usd
        data_tests: [not_null]
